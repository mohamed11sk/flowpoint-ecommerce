<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - Flowpoint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6C63FF;
      --secondary: #00C9A7;
      --bg: #0f172a;
      --glass: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* خلفية متحركة */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--primary), transparent);
      top: -150px;
      left: -150px;
      filter: blur(120px);
      opacity: 0.5;
    }

    body::after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--secondary), transparent);
      bottom: -150px;
      right: -150px;
      filter: blur(120px);
      opacity: 0.5;
    }

    .container {
      position: relative;
      z-index: 2;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      padding: 40px 25px;
      border-radius: 20px;
      text-align: center;
      width: 360px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
    }

    .logo span {
      color: var(--secondary);
    }

    h1 {
      color: #fff;
      font-size: 20px;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .g_id_signin {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .divider {
      margin: 20px 0;
      color: #aaa;
      font-size: 13px;
    }

    #content {
      margin-top: 20px;
      color: white;
    }

    #content img {
      border-radius: 50%;
      width: 70px;
      height: 70px;
      margin-top: 10px;
      border: 2px solid var(--secondary);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }

    .footer span {
      color: var(--secondary);
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="logo">Flow<span>point</span></div>
  <h1>تسجيل الدخول باستخدام Google</h1>

  <div id="g_id_onload"
       data-client_id="120199268347-pim0u8q3p205619asnaaq4a6h6kqc5s9.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="filled_black"
       data-shape="pill">
  </div>

  <div id="content"></div>

  <div class="footer">
    Powered by <span>Flowpoint</span>
  </div>

</div>

<script>
function handleCredentialResponse(response) {
  const data = parseJwt(response.credential);

  localStorage.setItem('user', JSON.stringify(data));
  window.location.href = "index.php";
}

function parseJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = atob(base64Url.replace(/-/g, '+').replace(/_/g, '/'));
  const jsonPayload = decodeURIComponent(
    base64.split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join('')
  );

  return JSON.parse(jsonPayload);
}
</script>

</body>
</html>
